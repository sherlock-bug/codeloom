name: Build musl release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build (e.g., v0.6.1)'
        required: true
        default: 'v0.6.1'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Install musl tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools

      - name: Generate sqlite-vec header
        run: |
          cd vendor/sqlite-vec
          sed -e 's/\${VERSION}/0.1.0/g' \
              -e 's/\${DATE}/2024-01-01/g' \
              -e 's/\${SOURCE}/generated/g' \
              -e 's/\${VERSION_MAJOR}/0/g' \
              -e 's/\${VERSION_MINOR}/1/g' \
              -e 's/\${VERSION_PATCH}/0/g' \
              sqlite-vec.h.tmpl > sqlite-vec.h
          echo "sqlite-vec.h generated: $(head -5 sqlite-vec.h | grep -c VERSION) version macros"
          echo "sqlite-vec.c: $(wc -l < sqlite-vec.c) lines (from repo)"

      - name: Install Rust musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Build
        run: |
          cargo build --release --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/codeloom .
          tar czf codeloom-${{ github.event.inputs.tag }}-linux-x86_64-musl.tar.gz codeloom

      - name: Verify
        run: |
          file codeloom | grep -q "statically linked" && echo "static" || echo "not-static"
          strings codeloom | grep -F "CodeLoom v" | head -1

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: codeloom-${{ github.event.inputs.tag }}-linux-x86_64-musl.tar.gz
