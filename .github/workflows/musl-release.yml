name: Build musl release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build (e.g., v0.6.1)'
        required: true
        default: 'v0.6.1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Install musl tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools

      - name: Verify sqlite-vec files exist
        run: |
          ls -la vendor/sqlite-vec/sqlite-vec.h vendor/sqlite-vec/sqlite-vec.c
          echo "sqlite-vec.h: $(head -3 vendor/sqlite-vec/sqlite-vec.h)"
          echo "sqlite-vec.c: $(wc -l < vendor/sqlite-vec/sqlite-vec.c) lines"

      - name: Install Rust musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Build
        run: |
          cargo build --release --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/codeloom .
          tar czf codeloom-${{ github.event.inputs.tag }}-linux-x86_64-musl.tar.gz codeloom

      - name: Verify
        run: |
          file codeloom | grep -q "statically linked" && echo "static" || echo "not-static"
          strings codeloom | grep -F "CodeLoom v" | head -1

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: codeloom-${{ github.event.inputs.tag }}-linux-x86_64-musl.tar.gz
